name: Deploy Discord Bot

on:
  push:
    branches:
      - main
    paths:
      - "apps/discord-bot/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-discord-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-discord-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Discord bot
        run: pnpm --filter discord-bot typecheck

      - name: Build Discord bot
        run: pnpm --filter discord-bot build

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config apps/discord-bot/fly.toml --app median-discord-bot --ha=false .
